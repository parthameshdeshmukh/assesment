<svg width="450" height="380" viewBox="0 0 450 380" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="dashGlow" cx="60%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#B2FF4D" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#B2FF4D" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="skinGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFDFC4"/>
      <stop offset="100%" stop-color="#E5AD89"/>
    </linearGradient>
    <linearGradient id="laptopGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="50%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <filter id="shadow2" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Glowing Orb -->
  <circle cx="260" cy="190" r="170" fill="url(#dashGlow)"/>

  <g filter="url(#shadow2)">
    <!-- Body -->
    <path d="M140 260 C140 210, 180 190, 240 190 C300 190, 340 210, 340 260 L350 380 L130 380 Z" fill="#1A1B1D"/>

    <!-- Head -->
    <ellipse cx="240" cy="130" rx="55" ry="60" fill="url(#skinGrad2)"/>
    <ellipse cx="182" cy="132" rx="10" ry="14" fill="url(#skinGrad2)"/>
    <ellipse cx="298" cy="132" rx="10" ry="14" fill="url(#skinGrad2)"/>

    <!-- Eyes looking at screen -->
    <ellipse cx="218" cy="125" rx="7" ry="9" fill="#1A1716"/>
    <circle cx="220" cy="122" r="2.5" fill="#FFFFFF"/>
    <ellipse cx="262" cy="125" rx="7" ry="9" fill="#1A1716"/>
    <circle cx="264" cy="122" r="2.5" fill="#FFFFFF"/>

    <!-- Eyebrows -->
    <path d="M208 110 Q218 106 228 110" stroke="#1A1716" stroke-width="4" stroke-linecap="round"/>
    <path d="M252 110 Q262 106 272 110" stroke="#1A1716" stroke-width="4" stroke-linecap="round"/>

    <!-- Hair -->
    <path d="M185 110 C180 70, 210 50, 240 50 C270 50, 300 70, 295 110 C285 80, 260 70, 240 70 C220 70, 195 80, 185 110 Z" fill="#1A1716"/>

    <!-- Apple Laptop in front -->
    <path d="M110 240 H370 L350 380 H130 Z" fill="url(#laptopGrad)"/>
    <rect x="90" y="370" width="300" height="15" rx="7.5" fill="#64748B"/>
    
    <!-- Apple Logo on laptop lid -->
    <path d="M240 295 C244 290, 248 292, 250 296 C245 299, 247 305, 251 306 C249 311, 244 315, 240 315 C236 315, 234 311, 231 306 C235 305, 236 299, 231 296 C233 292, 237 290, 240 295 Z" fill="#FFFFFF" opacity="0.9"/>
    <path d="M241 291 C243 288, 245 289, 246 292 C244 294, 242 293, 241 291 Z" fill="#FFFFFF" opacity="0.9"/>
  </g>
</svg>
