<svg width="450" height="520" viewBox="0 0 450 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Radial Glow -->
    <radialGradient id="bgGlow" cx="50%" cy="45%" r="45%" fx="50%" fy="45%">
      <stop offset="0%" stop-color="#B2FF4D" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#B2FF4D" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Skin 3D Gradient -->
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFDFC4"/>
      <stop offset="60%" stop-color="#F5C7A9"/>
      <stop offset="100%" stop-color="#E5AD89"/>
    </linearGradient>

    <!-- Shirt 3D Dark Gradient -->
    <linearGradient id="shirtGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2A2B2E"/>
      <stop offset="40%" stop-color="#1A1B1D"/>
      <stop offset="100%" stop-color="#0F1012"/>
    </linearGradient>

    <!-- Hair 3D Gradient -->
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2B2625"/>
      <stop offset="50%" stop-color="#1A1716"/>
      <stop offset="100%" stop-color="#0A0908"/>
    </linearGradient>

    <!-- Shadow filter -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
    <filter id="handGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#B2FF4D" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Glowing Background Circle -->
  <circle cx="225" cy="240" r="190" fill="url(#bgGlow)"/>

  <!-- Character Container with Shadow -->
  <g filter="url(#dropShadow)">
    <!-- Torso / Dark Long Sleeve Shirt -->
    <path d="M130 380 C130 330, 160 300, 225 300 C290 300, 320 330, 320 380 L340 520 L110 520 Z" fill="url(#shirtGrad)"/>

    <!-- Neck -->
    <rect x="205" y="260" width="40" height="50" rx="10" fill="url(#skinGrad)"/>

    <!-- Head / Face -->
    <ellipse cx="225" cy="205" rx="65" ry="72" fill="url(#skinGrad)"/>

    <!-- Ears -->
    <ellipse cx="158" cy="208" rx="12" ry="16" fill="url(#skinGrad)"/>
    <ellipse cx="292" cy="208" rx="12" ry="16" fill="url(#skinGrad)"/>

    <!-- Eyes 3D -->
    <ellipse cx="198" cy="196" rx="9" ry="12" fill="#1A1716"/>
    <circle cx="201" cy="192" r="3.5" fill="#FFFFFF"/>
    
    <ellipse cx="252" cy="196" rx="9" ry="12" fill="#1A1716"/>
    <circle cx="255" cy="192" r="3.5" fill="#FFFFFF"/>

    <!-- Eyebrows -->
    <path d="M186 178 C195 172, 208 174, 212 178" stroke="#1A1716" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M238 178 C242 174, 255 172, 264 178" stroke="#1A1716" stroke-width="4.5" stroke-linecap="round"/>

    <!-- Nose -->
    <path d="M225 198 L221 212 Q225 216 229 212 Z" fill="#E5AD89"/>

    <!-- Big Happy Smile -->
    <path d="M192 230 Q225 256 258 230" fill="none" stroke="#1A1716" stroke-width="5" stroke-linecap="round"/>
    <path d="M196 232 Q225 258 254 232" fill="#FFFFFF"/>

    <!-- 3D Hair Volumetric -->
    <path d="M160 180 C155 130, 185 110, 225 110 C265 110, 295 130, 290 180 C280 145, 255 135, 225 135 C195 135, 170 145, 160 180 Z" fill="url(#hairGrad)"/>
    <path d="M162 175 Q150 140 180 125 Q225 100 270 125 Q300 140 288 175 Q265 120 225 120 Q185 120 162 175 Z" fill="url(#hairGrad)"/>
    <path d="M200 115 C215 95, 240 95, 250 115 C235 105, 215 105, 200 115 Z" fill="#3D3735"/>

    <!-- Waving Right Arm & Hand -->
    <g class="waving-arm-group" style="transform-origin: 300px 320px;">
      <!-- Arm -->
      <path d="M300 320 Q350 260 370 200" stroke="url(#shirtGrad)" stroke-width="48" stroke-linecap="round"/>
      
      <!-- Hand Waving Palm -->
      <g filter="url(#handGlow)">
        <!-- Palm -->
        <ellipse cx="380" cy="170" rx="24" ry="28" transform="rotate(-15 380 170)" fill="url(#skinGrad)"/>
        <!-- Thumb -->
        <path d="M360 175 Q348 165 352 155 Q358 150 366 162 Z" fill="url(#skinGrad)"/>
        <!-- 4 Fingers -->
        <rect x="362" y="128" width="10" height="28" rx="5" transform="rotate(-25 362 128)" fill="url(#skinGrad)"/>
        <rect x="375" y="122" width="10" height="32" rx="5" transform="rotate(-15 375 122)" fill="url(#skinGrad)"/>
        <rect x="388" y="125" width="10" height="30" rx="5" transform="rotate(-5 388 125)" fill="url(#skinGrad)"/>
        <rect x="400" y="132" width="9" height="26" rx="4.5" transform="rotate(5 400 132)" fill="url(#skinGrad)"/>
      </g>
    </g>
  </g>
</svg>
